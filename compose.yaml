services:
    microsoft-rewards-script:
        # 本地构建本项目代码（V4-china 国内适配版）。
        # ghcr.io/thenetsky/... 是原作者 TheNetsky 的官方镜像，
        # 跑的是原版代码，不含本项目的国内适配（中国热搜 / PushPlus 等）。
        build: .
        image: microsoft-rewards-script:china
        container_name: microsoft-rewards-script
        restart: unless-stopped

        volumes:
            - ./config:/usr/src/microsoft-rewards-script/config
            - ./sessions:/usr/src/microsoft-rewards-script/sessions
            - ./clawbot:/usr/src/microsoft-rewards-script/clawbot

        env_file:
            - path: .env

        environment:
            # ── Scheduler ──────────────────────────────────────
            TZ: 'Asia/Shanghai'
            NODE_ENV: 'production'
            CRON_SCHEDULE: '0 7 * * *'
            RUN_ON_START: 'true'
            SKIP_RANDOM_SLEEP: 'false'

            # ── API mode ──────────────────────────────────────
            API_MODE: 'true'
            API_TOKEN: '${API_TOKEN}'
            API_ALLOW_SCHEDULE_WRITE: 'true'
            API_ALLOW_ENV_OVERRIDES: 'false'
            API_ALLOW_CONFIG_REVEAL: 'false'
            API_ALLOW_CONFIG_WRITE: 'true'

            # ── Configuration ──────────────────────────────────────

            # ── 国内特性（V4-china）──────────────────────────────────
            # gmya.net appkey，个人配额密钥，从 .env 读取（见 env.example）

            # ── 微信 ClawBot ─────────────────────────────────────

        # ── API mode port mapping ─────────────────────────────
        # API_MODE=true 时开放 Control API
        ports:
            - '127.0.0.1:3011:3010'

        healthcheck:
            test: ['CMD-SHELL', 'scripts/docker/healthcheck.sh']
            interval: 60s
            timeout: 5s
            retries: 3
            start_period: 30s

        security_opt:
            - no-new-privileges:true

        networks:
            - rewards

networks:
    rewards:
        driver: bridge
        external: true
