name: Publish container image

on:
    release:
        types: [published]
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            tag:
                description: 'Image tag to publish (e.g. v5.0.0-ch.1)'
                required: true

permissions:
    contents: read
    packages: write

concurrency:
    group: ghcr-${{ github.ref }}
    cancel-in-progress: false

env:
    # GHCR 要求全小写；仓库名里含大写字母，所以这里显式写死。
    IMAGE_NAME: ghcr.io/zpan2327/microsoft-rewards-script

jobs:
    publish:
        name: Build & push to GHCR
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4

            - name: Resolve version
              id: version
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
                  elif [ "${{ github.event_name }}" = "release" ]; then
                    echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
                  else
                    echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
                  fi

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_NAME }}
                  # 同时产出带 v 与不带 v 的版本标签，外加 latest 与分支标签，
                  # 这样 README 里的 docker pull ...:5.0.0-ch.1 也能直接命中。
                  tags: |
                      type=raw,value=${{ steps.version.outputs.value }}
                      type=semver,pattern={{version}},value=${{ steps.version.outputs.value }}
                      type=raw,value=latest
                      type=raw,value=v5-china
                  labels: |
                      org.opencontainers.image.title=Microsoft Rewards Script (zh-CN)
                      org.opencontainers.image.description=基于上游 v5.0.0 的中文本地化版：中国热搜查询源、微信推送、中文运行摘要
                      org.opencontainers.image.licenses=GPL-3.0-or-later
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Summary
              run: |
                  {
                    echo "### 镜像已发布"
                    echo ""
                    echo '```'
                    echo "${{ steps.meta.outputs.tags }}"
                    echo '```'
                    echo ""
                    echo "拉取：\`docker pull ${IMAGE_NAME}:${{ steps.version.outputs.value }}\`"
                  } >> "$GITHUB_STEP_SUMMARY"
