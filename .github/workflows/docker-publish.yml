name: Publish container image

on:
    release:
        types: [published]
    push:
        tags: ['v*']
    workflow_dispatch:
        inputs:
            tag:
                description: 'Image tag to publish (e.g. v5.0.0-ch.1)'
                required: true

permissions:
    contents: read
    packages: write

concurrency:
    group: ghcr-${{ github.ref }}
    cancel-in-progress: false

env:
    # GHCR 要求全小写；仓库名里含大写字母，所以这里显式写死。
    # 需要独立包名：旧的 microsoft-rewards-script 包由已删除的旧仓库创建，
    # 新仓库的 GITHUB_TOKEN 对同名包没有写权限（push 会被拒），故换新名字。
    IMAGE_NAME: ghcr.io/zpan2327/microsoft-rewards-script-v5

jobs:
    publish:
        name: Build & push to GHCR
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4

            - name: Resolve version
              id: version
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
                  elif [ "${{ github.event_name }}" = "release" ]; then
                    echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
                  else
                    echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
                  fi

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_NAME }}
                  # 同时产出带 v 与不带 v 的版本标签，外加 latest 与分支标签，
                  # 这样 README 里的 docker pull ...:5.0.0-ch.1 也能直接命中。
                  tags: |
                      type=raw,value=${{ steps.version.outputs.value }}
                      type=semver,pattern={{version}},value=${{ steps.version.outputs.value }}
                      type=raw,value=latest
                      type=raw,value=v5-china
                  labels: |
                      org.opencontainers.image.title=Microsoft Rewards Script (zh-CN)
                      org.opencontainers.image.description=基于上游 v5.0.0 的中文本地化版：中国热搜查询源、微信推送、中文运行摘要
                      org.opencontainers.image.licenses=GPL-3.0-or-later
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Summary
              run: |
                  {
                    echo "### 镜像已发布"
                    echo ""
                    echo '```'
                    echo "${{ steps.meta.outputs.tags }}"
                    echo '```'
                    echo ""
                    echo "拉取：\`docker pull ${IMAGE_NAME}:${{ steps.version.outputs.value }}\`"
                  } >> "$GITHUB_STEP_SUMMARY"

    # 打 tag 时自动建 GitHub Release。
    # 本仓库原本只在「Release 已发布」时才构建镜像 —— 但没有任何环节创建 Release，
    # 于是每次发版都只有镜像、Release 页面不更新。这个 job 补上这一环。
    release:
        name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Extract changelog section
              shell: bash
              run: |
                  # CHANGELOG 里的标题是 `## [5.0.0-ch.3]`，tag 是 `v5.0.0-ch.3`
                  TAG="${GITHUB_REF_NAME#v}"
                  awk -v tag="$TAG" '
                      index($0, "## [" tag "]") == 1 { flag = 1; next }
                      flag && index($0, "## [") == 1 { exit }
                      flag { print }
                  ' CHANGELOG.md > release-notes.md
                  if [ ! -s release-notes.md ]; then
                      echo "详见 [CHANGELOG.md](CHANGELOG.md)。" > release-notes.md
                  fi
                  echo "---- release-notes.md ----"
                  cat release-notes.md

            - name: Create release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ${{ github.ref_name }}
                  body_path: release-notes.md
                  draft: false
                  prerelease: false
